<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag crítico para asegurar el diseño responsivo en pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - POO</title>
    <!-- Enlazamos la hoja de estilos CSS para la interfaz visual -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestor de Tareas</h1>
        
        <!-- Sección de entrada de datos y validación -->
        <div class="input-section">
            <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea..." autocomplete="off">
            <button id="agregar-tarea">Agregar Tarea</button>
        </div>
        <!-- Mensaje de error oculto por defecto para validar entradas vacías -->
        <p id="error-msg" class="error-hidden">Por favor, escribe una tarea válida.</p>

        <!-- Lista (ul) donde JavaScript renderizará dinámicamente las tareas -->
        <ul id="lista-tareas"></ul>
    </div>

    <!-- Enlazamos el archivo de lógica JavaScript usando defer para que cargue después del DOM -->
    <script src="app.js" defer></script>
</body>
</html>
